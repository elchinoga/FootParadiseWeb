name: Sync Payhip Store

on:
  schedule:
    - cron: '0 10 * * *'  # Todos los dias a las 10am UTC
  workflow_dispatch:       # Tambien se puede correr manualmente

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install playwright cheerio
          npx playwright install --with-deps chromium

      - name: Run sync
        run: node .github/scripts/sync_store.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add store/index.html
          git diff --staged --quiet || git commit -m "auto: add new comics from Payhip"
          git push
