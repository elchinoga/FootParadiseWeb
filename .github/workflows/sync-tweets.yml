name: Sync tweet ticker

on:
  schedule:
    - cron: '0 12 * * *'   # 12:00 UTC = 09:00 Argentina (UTC-3)
  workflow_dispatch:         # también se puede lanzar a mano desde GitHub Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar tweets.json
        run: node .github/scripts/sync_tweets.js

      - name: Commit si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tweets.json
          if git diff --cached --quiet; then
            echo "Sin cambios, nada que commitear."
          else
            git commit -m "auto: actualizar tweet ticker"
            git push
          fi
