<html lang="en">
<head>

    <meta charset="UTF-8">

    <style>
        /* Gallery Specific Styles */
        .gallery-section {
            padding: 40px 20px;
            min-height: 100vh;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
        }

        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .gallery-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 48px;
            color: #FFE600;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 230, 0, 0.4);
        }

        .gallery-subtitle {
            color: #aaa;
            font-size: 16px;
        }

        /* Filter Buttons */
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 12px 30px;
            border: 2px solid #FF2D78;
            background: transparent;
            color: #FF2D78;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filter-btn:hover {
            background: rgba(255, 45, 120, 0.1);
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #FFE600 0%, #FF2D78 100%);
            border-color: #FF2D78;
            color: #111;
        }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            aspect-ratio: 1;
            background: #2a2a4a;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(255, 45, 120, 0.25);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease, opacity 0.3s ease;
            opacity: 0;
        }

        .gallery-item img.loaded {
            opacity: 1;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .gallery-item.hidden {
            display: none;
        }

        /* Skeleton Loader */
        .skeleton-loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #2a2a4a 25%, #3a3a5a 50%, #2a2a4a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 12px;
        }

        .gallery-item img.loaded + .skeleton-loader,
        .gallery-item img.loaded ~ .skeleton-loader {
            display: none;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        /* Lightbox */
        .gallery-lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .gallery-lightbox.active {
            display: flex;
        }

        .lightbox-img-container {
            max-width: 90vw;
            max-height: 90vh;
            position: relative;
        }

        .gallery-lightbox img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .lightbox-close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 45, 120, 0.9);
            border: none;
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10001;
        }

        .lightbox-close-btn:hover {
            background: #FF2D78;
            transform: scale(1.1);
        }

        /* Back button */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #FF2D78;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #fff;
            transform: translateX(-5px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .gallery-title {
                font-size: 36px;
            }
            
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
            }

            .filter-btn {
                padding: 10px 20px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- Lightbox -->
    <div class="gallery-lightbox" id="gallery-lightbox">
        <button class="lightbox-close-btn" id="lightbox-close-btn">
            <i class="fas fa-times"></i>
        </button>
        <div class="lightbox-img-container">
            <img src="" alt="" id="lightbox-img">
        </div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-menu">
                <a href="../index.html" class="nav-link" data-i18n="nav.home">Home</a>
                <a href="../store/" class="nav-link" data-i18n="nav.store">Store</a>
                <a href="../commission/" class="nav-link" data-i18n="nav.commission">Commission</a>
                <a href="../gallery/" class="nav-link active">Gallery<span class="nav-dot"></span></a>
                <a href="../comics/" class="nav-link" data-i18n="nav.comics">Comics</a>
                <a href="../app/" class="nav-link" data-i18n="nav.app">App</a>
                <a href="../info/" class="nav-link" data-i18n="nav.connect">Connect</a>
            </div>
            <div class="lang-dropdown" id="lang-dropdown"><button class="lang-toggle-btn" onclick="toggleLangDropdown()" id="lang-toggle-btn">🌐 <span id="lang-current-label">EN</span> <i class="fas fa-chevron-down lang-arrow" id="lang-arrow"></i></button><div class="lang-menu" id="lang-menu"><button class="lang-option active" id="lang-opt-en" onclick="selectLang('en')">🇺🇸 English</button><button class="lang-option" id="lang-opt-es" onclick="selectLang('es')">🇪🇸 Español</button></div></div>
        </div>
    </nav>

    <!-- Gallery Section -->
    <section class="gallery-section">
        <div class="gallery-container">
            <a href="../index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>

            <div class="gallery-header">
                <h1 class="gallery-title">Completed Commissions</h1>
                <p class="gallery-subtitle">Browse through our collection of completed artwork</p>
            </div>

            <!-- Filter Buttons -->
            <div class="filter-container">
                <button class="filter-btn active" data-filter="all">
                    <i class="fas fa-th"></i> All
                </button>
                <button class="filter-btn" data-filter="illustration">
                    <i class="fas fa-paint-brush"></i> Illustrations
                </button>
                <button class="filter-btn" data-filter="comic">
                    <i class="fas fa-book-open"></i> Comics
                </button>
            </div>

            <!-- Gallery Grid -->
            <div class="gallery-grid" id="gallery-grid">
                <!-- Items will be loaded dynamically from gallery-data.js -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-content">
                <div class="footer-brand">
                    <h3>Footparadise</h3>
                    <p>Exclusive foot-focused artwork</p>
                </div>
                <div class="footer-cta">
                    <a href="https://www.patreon.com/c/foot_paradise" class="btn-patreon" target="_blank" rel="noopener noreferrer">
                        <i class="fab fa-patreon"></i> Support on Patreon
                    </a>
                </div>
            </div>
            <div class="footer-copyright">
                <p>&copy; 2024 Footparadise. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Gallery Data - EDIT THIS FILE TO ADD NEW IMAGES -->
    <script src="gallery-data.js"></script>
    <script src="../lang.js"></script>
    
    <script>
        // Render gallery items
        function renderGallery() {
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '';
            
            galleryItems.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                div.setAttribute('data-type', item.type);
                div.setAttribute('data-index', index);
                
                div.innerHTML = `
                    <img src="${item.thumb}" alt="" loading="lazy" onload="this.classList.add('loaded')">
                    <div class="skeleton-loader"></div>
                `;
                
                div.addEventListener('click', () => openLightbox(index));
                grid.appendChild(div);
            });
        }

        // Filter functionality
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Update active button
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const filter = btn.getAttribute('data-filter');
                const items = document.querySelectorAll('.gallery-item');
                
                items.forEach(item => {
                    if (filter === 'all' || item.getAttribute('data-type') === filter) {
                        item.classList.remove('hidden');
                    } else {
                        item.classList.add('hidden');
                    }
                });
            });
        });

        // Lightbox functionality
        const lightbox = document.getElementById('gallery-lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.getElementById('lightbox-close-btn');

        function openLightbox(index) {
            const item = galleryItems[index];
            lightboxImg.src = item.full;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        closeBtn.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeLightbox();
            }
        });

        // Initialize gallery
        renderGallery();
    </script>
</body>
</html>
